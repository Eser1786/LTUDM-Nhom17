services:
  mysql:
    image: mysql:8.4
    container_name: tkb-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Chi mo cho may local. Khi dua len VPS thi bo dong nay neu server Java chay cung may.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - tkb-mysql-data:/var/lib/mysql
      - ./init-schema/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Cong cu xem du lieu bang trinh duyet (chi dung khi phat trien, xoa khi len VPS)
  adminer:
    image: adminer:latest
    container_name: tkb-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  tkb-mysql-data: